databaseChangeLog:
  - changeSet:
      id: ktor-noti-005-create-event-variables
      author: ktor-notification
      changes:
        - createTable:
            tableName: event_variables
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: variable_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_ev_event_id
            baseTableName: event_variables
            baseColumnNames: event_id
            referencedTableName: event_notifications
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_ev_variable_id
            baseTableName: event_variables
            baseColumnNames: variable_id
            referencedTableName: variables
            referencedColumnNames: id
