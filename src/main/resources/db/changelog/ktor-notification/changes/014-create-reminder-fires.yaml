databaseChangeLog:
  - changeSet:
      id: ktor-noti-014-create-reminder-fires
      author: ktor-notification
      changes:
        - createTable:
            tableName: reminder_fires
            columns:
              - column:
                  name: rule_id
                  type: BIGINT
                  constraints: { nullable: false, foreignKeyName: fk_reminder_fires_rule, references: reminder_rules(id), deleteCascade: true }
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: fired_on
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: offset_used
                  type: INTEGER
                  constraints: { nullable: false }
              - column:
                  name: sent_count
                  type: INTEGER
                  constraints: { nullable: false }
        - addPrimaryKey:
            tableName: reminder_fires
            columnNames: rule_id, employee_id, fired_on
            constraintName: pk_reminder_fires
