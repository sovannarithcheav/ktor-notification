databaseChangeLog:
  - changeSet:
      id: ktor-noti-014-create-reminder-fires
      author: ktor-notification
      changes:
        - createTable:
            tableName: reminder_fires
            columns:
              - column:
                  name: rule_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: fired_on
                  type: DATE
                  constraints: { nullable: false }
              - column:
                  name: offset_used
                  type: INTEGER
                  constraints: { nullable: false }
              - column:
                  name: sent_count
                  type: INTEGER
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: reminder_fires
            baseColumnNames: rule_id
            referencedTableName: reminder_rules
            referencedColumnNames: id
            constraintName: fk_rf_rule_id
            onDelete: CASCADE
        - addPrimaryKey:
            tableName: reminder_fires
            columnNames: rule_id, employee_id, fired_on
            constraintName: pk_reminder_fires
