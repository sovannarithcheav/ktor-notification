databaseChangeLog:
  - changeSet:
      id: ktor-noti-012-create-reminder-rules
      author: ktor-notification
      changes:
        - createTable:
            tableName: reminder_rules
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: date_kind
                  type: VARCHAR(64)
                  constraints: { nullable: false }
              - column:
                  name: offset_days
                  type: INTEGER[]
                  constraints: { nullable: false }
              - column:
                  name: event_id
                  type: BIGINT
                  constraints: { nullable: false, foreignKeyName: fk_reminder_rules_event, references: event_notifications(id) }
              - column:
                  name: channel_ids
                  type: BIGINT[]
                  constraints: { nullable: false }
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: BIGINT
              - column:
                  name: updated_by
                  type: BIGINT
        - sql:
            sql: |
              ALTER TABLE reminder_rules
                ADD CONSTRAINT reminder_rules_offsets_nonempty CHECK (cardinality(offset_days) > 0),
                ADD CONSTRAINT reminder_rules_offsets_nonnegative CHECK (0 <= ALL(offset_days)),
                ADD CONSTRAINT reminder_rules_channels_nonempty CHECK (cardinality(channel_ids) > 0);
